# Feature Engineering Config
tfidf:
  ngram_range: [1, 2]
  max_features: 10000
  sublinear_tf: true
  lowercase: true

embeddings:
  model_id: "BAAI/bge-small-en-v1.5"
  batch_size: 32
  use_gpu: false
  dimension: 384

domain_keywords:
  BUSINESS_INVOICE:
